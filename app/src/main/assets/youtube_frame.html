<html>
<body style='margin:0px;padding:0px;'>
<script type='text/javascript' src='http://www.youtube.com/iframe_api'></script>
<script type='text/javascript'> var player; function onYouTubeIframeAPIReady() {player=new YT.Player('playerId',{events:{onReady:onPlayerReady}})}
						function onPlayerReady(event){player.playVideo();}
</script>
<div style="background: transparent; width: 100%; height: 100%; z-index: 999; position: absolute;"></div>
<iframe id='playerId' type='text/html' width='100%' height='100%'
        src='https://www.youtube.com/embed/[VIDEO_ID]?enablejsapi=1&autoplay=1&controls=0&showinfo=0&cc_load_policy=[CC_LOAD]&frameborder="0"&rel=0'/>
</body>
</html>
